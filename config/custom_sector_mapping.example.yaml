# 本地预设板块映射（实验功能）
#
# 用途：为尚未在行情数据源建好板块的新概念手动指定成分股，
#       用于实验性趋同验证——如果预设股票集合和引擎识别的板块走势趋同，
#       说明预设合理；否则需要调整。
#
# 使用方法：
# 1. 复制本文件为 custom_sector_mapping.yaml
# 2. 按下方格式添加自定义板块
# 3. 重启服务后生效（进程内缓存）
#
# 格式说明：
#   板块名:
#     - "股票代码1"
#     - "股票代码2"
#
# 股票代码支持以下格式（会自动规范化为 6 位数字）：
#   - "300308"     （纯数字）
#   - "300308.SZ"  （带交易所后缀）
#   - "300308"     （不足 6 位会补零）
#
# 示例：

# CPO（共封装光学）—— 新概念，行情数据源可能尚未建板块
CPO:
  - "300308"   # 中际旭创
  - "002281"   # 光迅科技
  - "300682"   # 朗新集团

# 铜缆高速连接 —— 新概念
铜缆高速连接:
  - "002873"   # 新亚电子
  - "300682"   # 朗新集团
  - "002138"   # 顺络电子

# 1.6T 光模块 —— 细分新概念
1.6T光模块:
  - "300308"   # 中际旭创
  - "002281"   # 光迅科技
